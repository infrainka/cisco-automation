---
all:
  vars:
    ansible_network_os: cisco.ios.ios
    ansible_connection: network_cli
    
    #Force Ansible to use native OpenSSH instead of libssh
    ansible_network_cli_ssh_type: paramiko
    
    # Prevents failure if the RSA keys change or aren't known
    ansible_host_key_checking: false
  
  children:
    routers:
      hosts:
        isr4400:
          ansible_host: "{{ lookup('env', 'ROUTER_IP') }}"
          ansible_user: "{{ lookup('env', 'ROUTER_USER') }}"
          ansible_password: "{{ lookup('env', 'ROUTER_PASS') }}"

    switches:
      hosts:
        l3_switch:
          ansible_host: "{{ lookup('env', 'SWITCH_IP') }}"
          ansible_user: "{{ lookup('env', 'SWITCH_USER') }}"
          ansible_password: "{{ lookup('env', 'SWITCH_PASS') }}"
